<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0a0a0a">
    <title>全球電台播放器 | Global Radio Player</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Orbitron', 'Rajdhani', sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #0a0a0a 100%);
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            padding: 20px;
        }

        .background-grid {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                linear-gradient(rgba(0, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            opacity: 0.3;
            z-index: 0;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: clamp(2rem, 5vw, 3.5rem);
            font-weight: 900;
            background: linear-gradient(135deg, #00ffff, #ff00ff, #00ffff);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradient 3s ease infinite;
            text-transform: uppercase;
            letter-spacing: 0.3em;
            text-shadow: 0 0 30px rgba(0, 255, 255, 0.5);
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1rem;
            color: #00ffff;
            letter-spacing: 0.2em;
            opacity: 0.8;
        }

        .player-main {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.02));
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 30px;
            border: 1px solid rgba(0, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), inset 0 0 40px rgba(0, 255, 255, 0.1);
            margin-bottom: 30px;
        }

        .spectrum {
            display: flex;
            gap: 4px;
            height: 80px;
            align-items: flex-end;
            justify-content: center;
            margin-bottom: 25px;
            padding: 0 20px;
        }

        .spectrum-bar {
            flex: 1;
            background: linear-gradient(to top, #00ffff, #ff00ff);
            border-radius: 3px 3px 0 0;
            transition: height 0.1s ease;
            min-height: 5%;
            opacity: 0.3;
        }

        .spectrum-bar.active {
            opacity: 0.9;
        }

        .now-playing {
            text-align: center;
            margin-bottom: 25px;
        }

        .station-name {
            font-size: 2rem;
            font-weight: 700;
            color: #00ffff;
            margin-bottom: 8px;
            text-shadow: 0 0 20px rgba(0, 255, 255, 0.6);
            min-height: 40px;
        }

        .station-info {
            font-size: 1.1rem;
            color: #ff00ff;
            opacity: 0.9;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .play-btn {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 3px solid #00ffff;
            background: linear-gradient(135deg, #00ffff, #0088ff);
            color: #000;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.6);
            font-size: 0;
        }

        .play-btn:disabled {
            background: #333;
            border-color: #666;
            cursor: not-allowed;
            box-shadow: none;
            opacity: 0.5;
        }

        .play-btn:not(:disabled):hover {
            transform: scale(1.15);
        }

        .play-btn.playing {
            transform: scale(1.05);
        }

        .fav-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 2px solid #ff00ff;
            background: transparent;
            color: #ff00ff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .fav-btn:hover {
            transform: scale(1.1);
        }

        .fav-btn.active {
            background: #ff00ff;
            color: #000;
            box-shadow: 0 0 20px rgba(255, 0, 255, 0.6);
        }

        .volume-control {
            display: flex;
            align-items: center;
            gap: 15px;
            max-width: 400px;
            margin: 0 auto 20px;
        }

        .volume-btn {
            background: transparent;
            border: none;
            color: #00ffff;
            cursor: pointer;
            padding: 8px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
        }

        .volume-btn:hover {
            transform: scale(1.2);
        }

        .volume-btn.muted {
            color: #ff00ff;
        }

        .volume-slider {
            flex: 1;
            height: 8px;
            border-radius: 4px;
            outline: none;
            cursor: pointer;
            -webkit-appearance: none;
            appearance: none;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00ffff, #0088ff);
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.8);
            transition: all 0.3s ease;
        }

        .volume-slider::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        .volume-slider::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00ffff, #0088ff);
            cursor: pointer;
            border: none;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.8);
        }

        .volume-text {
            min-width: 50px;
            color: #00ffff;
            font-size: 1.1rem;
            font-weight: 600;
            text-align: right;
        }

        .audio-quality {
            margin-top: 20px;
            text-align: center;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.6);
        }

        .audio-quality label {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
        }

        .audio-quality input {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .search-filter {
            margin-bottom: 25px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }

        @media (min-width: 768px) {
            .search-filter {
                grid-template-columns: 1fr auto;
            }
        }

        .search-box {
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 15px 15px 15px 50px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 255, 255, 0.3);
            border-radius: 12px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .search-input:focus {
            border-color: #00ffff;
        }

        .search-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #00ffff;
            pointer-events: none;
        }

        .country-select {
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 0, 255, 0.3);
            border-radius: 12px;
            color: #fff;
            font-size: 1rem;
            cursor: pointer;
            outline: none;
            min-width: 200px;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            text-align: left;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .country-select:hover {
            background: rgba(255, 0, 255, 0.1);
            border-color: #ff00ff;
        }

        .country-select::after {
            content: '▼';
            margin-left: 10px;
            font-size: 0.8rem;
            color: #ff00ff;
        }

        .favorites-section {
            background: linear-gradient(135deg, rgba(255, 0, 255, 0.1), rgba(255, 0, 255, 0.05));
            border-radius: 12px;
            padding: 15px;
            border: 1px solid rgba(255, 0, 255, 0.3);
            margin-bottom: 15px;
        }

        .favorites-title {
            font-size: 0.9rem;
            color: #ff00ff;
            margin-bottom: 10px;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .favorites-list {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .fav-chip {
            padding: 8px 16px;
            background: rgba(255, 0, 255, 0.2);
            border: 1px solid #ff00ff;
            border-radius: 20px;
            color: #fff;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .fav-chip:hover {
            background: rgba(255, 0, 255, 0.4);
        }

        .fav-chip.active {
            background: linear-gradient(135deg, #ff00ff, #ff0080);
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #00ffff;
            font-size: 1.2rem;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(0, 255, 255, 0.2);
            border-top: 4px solid #00ffff;
            border-radius: 50%;
            margin: 0 auto 20px;
            animation: spin 1s linear infinite;
        }

        .stations-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        @media (max-width: 640px) {
            .stations-grid {
                grid-template-columns: 1fr;
            }
        }

        .station-card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.02));
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .station-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 30px rgba(0, 255, 255, 0.4);
        }

        .station-card.active {
            background: linear-gradient(135deg, rgba(0, 255, 255, 0.15), rgba(255, 0, 255, 0.15));
            border: 2px solid #00ffff;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.4);
        }

        .station-logo {
            width: 60px;
            height: 60px;
            border-radius: 12px;
            background: linear-gradient(135deg, #00ffff, #ff00ff);
            background-size: cover;
            background-position: center;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .station-name-card {
            font-size: 1.1rem;
            font-weight: 600;
            color: #fff;
            margin-bottom: 8px;
            line-height: 1.4;
            min-height: 44px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .station-details {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .station-fav-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 5px;
            transition: all 0.3s ease;
            color: rgba(255, 255, 255, 0.4);
        }

        .station-fav-btn:hover {
            transform: scale(1.2);
        }

        .station-fav-btn.active {
            color: #ff00ff;
        }

        .playing-indicator {
            position: absolute;
            bottom: 15px;
            right: 15px;
            display: flex;
            gap: 3px;
            align-items: flex-end;
        }

        .wave-bar {
            width: 3px;
            height: 12px;
            background: #00ffff;
            border-radius: 2px;
            box-shadow: 0 0 8px #00ffff;
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes wave {
            0%, 100% { height: 8px; }
            50% { height: 20px; }
        }

        .wave-bar:nth-child(1) { animation: wave 0.8s ease-in-out 0s infinite; }
        .wave-bar:nth-child(2) { animation: wave 0.8s ease-in-out 0.1s infinite; }
        .wave-bar:nth-child(3) { animation: wave 0.8s ease-in-out 0.2s infinite; }
        .wave-bar:nth-child(4) { animation: wave 0.8s ease-in-out 0.3s infinite; }

        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }

        ::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #00ffff, #ff00ff);
            border-radius: 5px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(135deg, #00dddd, #dd00dd);
        }

        .country-modal.hidden {
            display: none !important;
        }

        .hidden {
            display: none;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, rgba(0, 255, 255, 0.95), rgba(255, 0, 255, 0.95));
            color: #000;
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 0.9rem;
            font-weight: 600;
            box-shadow: 0 4px 20px rgba(0, 255, 255, 0.5);
            z-index: 1000;
            animation: slideUp 0.3s ease;
            pointer-events: none;
        }

        .alphabet-nav {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-bottom: 15px;
            padding: 15px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.03), rgba(255, 255, 255, 0.01));
            border-radius: 12px;
            border: 1px solid rgba(0, 255, 255, 0.2);
        }

        .alphabet-btn {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            border: 1px solid rgba(0, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.05);
            color: #00ffff;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .alphabet-btn:hover {
            background: rgba(0, 255, 255, 0.2);
            border-color: #00ffff;
            transform: scale(1.1);
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.4);
        }

        .alphabet-btn.active {
            background: linear-gradient(135deg, #00ffff, #0088ff);
            color: #000;
            border-color: #00ffff;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.6);
        }

        .alphabet-btn.disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .alphabet-btn.disabled:hover {
            transform: none;
            background: rgba(255, 255, 255, 0.05);
            box-shadow: none;
        }

        .country-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            animation: fadeIn 0.3s ease;
        }

        .country-modal-content {
            background: linear-gradient(135deg, #1a1a2e, #0a0a0a);
            border: 2px solid rgba(0, 255, 255, 0.3);
            border-radius: 20px;
            max-width: 800px;
            width: 100%;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 8px 40px rgba(0, 255, 255, 0.3);
        }

        .country-modal-header {
            padding: 20px;
            border-bottom: 1px solid rgba(0, 255, 255, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .country-modal-header h2 {
            color: #00ffff;
            font-size: 1.5rem;
            margin: 0;
        }

        .close-modal-btn {
            background: transparent;
            border: none;
            color: #ff00ff;
            font-size: 2rem;
            cursor: pointer;
            padding: 0;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .close-modal-btn:hover {
            color: #00ffff;
            transform: rotate(90deg);
        }

        .country-list {
            overflow-y: auto;
            padding: 20px;
            flex: 1;
        }

        .country-letter-group {
            margin-bottom: 20px;
        }

        .country-letter-header {
            color: #00ffff;
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 10px;
            padding: 10px;
            background: linear-gradient(90deg, rgba(0, 255, 255, 0.2), transparent);
            border-left: 3px solid #00ffff;
            scroll-margin-top: 20px;
        }

        .country-item {
            padding: 12px 15px;
            margin-bottom: 8px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
            position: relative;
            z-index: 1;
        }

        .country-item * {
            pointer-events: none;
        }

        .country-item:hover {
            background: rgba(0, 255, 255, 0.1);
            border-color: #00ffff;
            transform: translateX(5px);
        }

        .country-item-name {
            color: #fff;
            font-size: 1rem;
        }

        .country-item-count {
            color: #ff00ff;
            font-size: 0.85rem;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }
    </style>
</head>
<body>
    <div class="background-grid"></div>
    
    <div class="container">
        <!-- 標題 -->
        <div class="header">
            <h1>🎵 GLOBAL RADIO</h1>
            <p>全球電台 · 即時串流 · 高音質播放</p>
        </div>

        <!-- 主播放器 -->
        <div class="player-main">
            <!-- 頻譜 -->
            <div class="spectrum" id="spectrum">
                <!-- 32 bars will be generated by JS -->
            </div>

            <!-- 當前播放 -->
            <div class="now-playing">
                <div class="station-name" id="currentStationName">請選擇電台</div>
                <div class="station-info" id="currentStationInfo"></div>
            </div>

            <!-- 控制按鈕 -->
            <div class="controls">
                <button class="play-btn" id="playBtn" disabled>
                    <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polygon points="5 3 19 12 5 21 5 3" id="playIcon"></polygon>
                        <rect x="6" y="4" width="4" height="16" id="pauseIcon1" class="hidden"></rect>
                        <rect x="14" y="4" width="4" height="16" id="pauseIcon2" class="hidden"></rect>
                    </svg>
                </button>
                <button class="fav-btn" id="favBtn" style="display: none;">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path id="heartPath" d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                    </svg>
                </button>
            </div>

            <!-- 音量控制 -->
            <div class="volume-control">
                <button class="volume-btn" id="muteBtn">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" id="volumeIcon">
                        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                        <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07" id="volumeWaves"></path>
                    </svg>
                </button>
                <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.01" value="0.7">
                <span class="volume-text" id="volumeText">70%</span>
            </div>

            <!-- 音質增強 -->
            <div class="audio-quality">
                <label>
                    <input type="checkbox" id="audioQuality" checked>
                    <span id="qualityLabel">音質增強 (EQ Boost)</span>
                </label>
            </div>
        </div>

        <!-- 搜尋和篩選 -->
        <div class="search-filter">
            <div class="search-box">
                <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"></circle>
                    <path d="m21 21-4.35-4.35"></path>
                </svg>
                <input type="text" class="search-input" id="searchInput" placeholder="搜尋電台名稱...">
            </div>
            <button class="country-select" id="countrySelectBtn">
                <span id="selectedCountryText">🌍 選擇國家</span>
            </button>
        </div>

        <!-- 我的最愛 -->
        <div class="favorites-section hidden" id="favoritesSection">
            <div class="favorites-title">★ 我的最愛 (<span id="favCount">0</span>)</div>
            <div class="favorites-list" id="favoritesList"></div>
        </div>

        <!-- 載入中 -->
        <div class="loading hidden" id="loading">
            <div class="spinner"></div>
            <div>載入電台中...</div>
        </div>

        <!-- 電台列表 -->
        <div class="stations-grid" id="stationsGrid"></div>
    </div>

    <!-- Audio Element -->
    <audio id="audioPlayer" crossorigin="anonymous" preload="auto"></audio>

    <!-- 國家選擇模態框 -->
    <div class="country-modal hidden" id="countryModal">
        <div class="country-modal-content">
            <div class="country-modal-header">
                <h2>🌍 選擇國家</h2>
                <button class="close-modal-btn" id="closeModalBtn">×</button>
            </div>
            <div style="padding: 15px; border-bottom: 1px solid rgba(0, 255, 255, 0.2);">
                <div class="alphabet-nav" id="alphabetNav"></div>
            </div>
            <div class="country-list" id="countryList"></div>
        </div>
    </div>

    <script>
        // 全域變數
        let stations = [];
        let filteredStations = [];
        let currentStation = null;
        let isPlaying = false;
        let volume = 0.7;
        let isMuted = false;
        let favorites = [];
        let countries = [];
        let audioContext = null;
        let analyser = null;
        let source = null;
        let gainNode = null;
        let equalizers = [];
        let animationFrame = null;
        let spectrum = Array(32).fill(0);
        
        // 初始化電台數據存儲
        window.stationsData = {};

        // DOM 元素
        const audioPlayer = document.getElementById('audioPlayer');
        const playBtn = document.getElementById('playBtn');
        const favBtn = document.getElementById('favBtn');
        const muteBtn = document.getElementById('muteBtn');
        const volumeSlider = document.getElementById('volumeSlider');
        const volumeText = document.getElementById('volumeText');
        const searchInput = document.getElementById('searchInput');
        const countrySelectBtn = document.getElementById('countrySelectBtn');
        const selectedCountryText = document.getElementById('selectedCountryText');
        const stationsGrid = document.getElementById('stationsGrid');
        const loading = document.getElementById('loading');
        const currentStationName = document.getElementById('currentStationName');
        const currentStationInfo = document.getElementById('currentStationInfo');
        const favoritesSection = document.getElementById('favoritesSection');
        const favoritesList = document.getElementById('favoritesList');
        const favCount = document.getElementById('favCount');
        const audioQuality = document.getElementById('audioQuality');
        const spectrumElement = document.getElementById('spectrum');
        const countryModal = document.getElementById('countryModal');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const alphabetNav = document.getElementById('alphabetNav');
        const countryList = document.getElementById('countryList');

        // 初始化頻譜條
        for (let i = 0; i < 32; i++) {
            const bar = document.createElement('div');
            bar.className = 'spectrum-bar';
            spectrumElement.appendChild(bar);
        }
        const spectrumBars = document.querySelectorAll('.spectrum-bar');

        // 載入收藏
        function loadFavorites() {
            const saved = localStorage.getItem('radioFavorites');
            if (saved) {
                favorites = JSON.parse(saved);
                updateFavoritesDisplay();
            }
        }

        // 保存收藏
        function saveFavorites() {
            localStorage.setItem('radioFavorites', JSON.stringify(favorites));
            updateFavoritesDisplay();
        }

        // 更新收藏顯示
        function updateFavoritesDisplay() {
            if (favorites.length > 0) {
                favoritesSection.classList.remove('hidden');
                favCount.textContent = favorites.length;
                favoritesList.innerHTML = favorites.map(station => {
                    const isActive = currentStation?.stationuuid === station.stationuuid;
                    return `
                        <div class="fav-chip ${isActive ? 'active' : ''}" 
                             data-fav-uuid="${station.stationuuid}">
                            ${station.name}
                        </div>
                    `;
                }).join('');
                
                // 添加收藏列表點擊事件
                favoritesList.querySelectorAll('.fav-chip').forEach(chip => {
                    chip.addEventListener('click', () => {
                        const uuid = chip.getAttribute('data-fav-uuid');
                        const station = favorites.find(s => s.stationuuid === uuid);
                        if (station) {
                            playStation(station);
                        }
                    });
                });
            } else {
                favoritesSection.classList.add('hidden');
            }
        }

        // 顯示提示訊息
        function showToast(message) {
            // 移除舊的提示
            const oldToast = document.querySelector('.toast');
            if (oldToast) {
                oldToast.remove();
            }
            
            // 創建新提示
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = message;
            document.body.appendChild(toast);
            
            // 3秒後移除
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 2000);
        }
        
        // 切換收藏
        function toggleFavorite(station) {
            const index = favorites.findIndex(s => s.stationuuid === station.stationuuid);
            if (index >= 0) {
                favorites.splice(index, 1);
                console.log('已移除收藏:', station.name);
                showToast('❌ 已移除收藏：' + station.name);
            } else {
                favorites.push(station);
                console.log('已加入收藏:', station.name);
                showToast('⭐ 已加入收藏：' + station.name);
            }
            saveFavorites();
            renderStations(filteredStations);
            
            // 如果當前播放的是這個電台，更新收藏按鈕
            if (currentStation?.stationuuid === station.stationuuid) {
                updateFavButton();
            }
        }

        // 檢查是否收藏
        function isFavorite(station) {
            return favorites.some(s => s.stationuuid === station.stationuuid);
        }

        // API 基礎 URL（使用自動路由服務器）
        const API_BASE = 'https://all.api.radio-browser.info/json';
        
        // 帶重試的 fetch 函數
        async function fetchWithRetry(url, retries = 3) {
            for (let i = 0; i < retries; i++) {
                try {
                    const response = await fetch(url, {
                        method: 'GET',
                        headers: {
                            'User-Agent': 'RadioPlayerApp/1.0'
                        }
                    });
                    
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}`);
                    }
                    
                    return await response.json();
                } catch (error) {
                    console.log(`嘗試 ${i + 1}/${retries} 失敗:`, error);
                    
                    if (i === retries - 1) {
                        throw error;
                    }
                    
                    // 等待後重試
                    await new Promise(resolve => setTimeout(resolve, 1000 * (i + 1)));
                }
            }
        }
        
        // 獲取熱門電台
        async function fetchPopularStations() {
            loading.classList.remove('hidden');
            try {
                const data = await fetchWithRetry(`${API_BASE}/stations/topvote/100`);
                stations = data;
                filteredStations = data;
                renderStations(data);
                showToast('✅ 已載入熱門電台');
            } catch (error) {
                console.error('獲取電台失敗:', error);
                showToast('❌ 載入失敗，請檢查網路連接');
                stationsGrid.innerHTML = `
                    <div style="grid-column: 1/-1; text-align: center; padding: 60px 20px; color: #ff00ff;">
                        <div style="font-size: 3rem; margin-bottom: 20px;">😞</div>
                        <div style="font-size: 1.2rem; margin-bottom: 10px;">無法連接到電台服務器</div>
                        <div style="font-size: 0.9rem; opacity: 0.7;">請檢查網路連接或稍後再試</div>
                        <button onclick="fetchPopularStations()" style="margin-top: 20px; padding: 12px 24px; background: linear-gradient(135deg, #00ffff, #ff00ff); border: none; border-radius: 20px; color: #000; font-weight: 600; cursor: pointer;">
                            重新載入
                        </button>
                    </div>
                `;
            }
            loading.classList.add('hidden');
        }

        // 獲取國家列表
        async function fetchCountries() {
            try {
                const data = await fetchWithRetry(`${API_BASE}/countries`);
                countries = data
                    .filter(c => c.stationcount > 0)
                    .sort((a, b) => a.name.localeCompare(b.name));
                
                renderCountryModal();
                showToast('✅ 國家列表已載入');
            } catch (error) {
                console.error('獲取國家列表失敗:', error);
                showToast('❌ 無法載入國家列表');
            }
        }

        // 渲染國家選擇模態框
        function renderCountryModal() {
            // 按字母分組
            const groupedCountries = {};
            const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
            
            countries.forEach(country => {
                const firstLetter = country.name[0].toUpperCase();
                if (!groupedCountries[firstLetter]) {
                    groupedCountries[firstLetter] = [];
                }
                groupedCountries[firstLetter].push(country);
            });

            // 渲染字母導航
            alphabetNav.innerHTML = alphabet.map(letter => {
                const hasCountries = groupedCountries[letter] && groupedCountries[letter].length > 0;
                return `
                    <button class="alphabet-btn ${hasCountries ? '' : 'disabled'}" 
                            data-letter="${letter}"
                            ${!hasCountries ? 'disabled' : ''}>
                        ${letter}
                    </button>
                `;
            }).join('');

            // 渲染國家列表
            countryList.innerHTML = `
                <div class="country-item" data-country-code="">
                    <span class="country-item-name">🌍 所有國家</span>
                    <span class="country-item-count">顯示熱門電台</span>
                </div>
                ${alphabet.map(letter => {
                    if (!groupedCountries[letter]) return '';
                    
                    return `
                        <div class="country-letter-group" id="letter-${letter}">
                            <div class="country-letter-header">${letter}</div>
                            ${groupedCountries[letter].map(country => `
                                <div class="country-item" data-country-code="${country.iso_3166_1}">
                                    <span class="country-item-name">${country.name}</span>
                                    <span class="country-item-count">${country.stationcount} 個電台</span>
                                </div>
                            `).join('')}
                        </div>
                    `;
                }).join('')}
            `;

            // 添加字母導航點擊事件
            alphabetNav.querySelectorAll('.alphabet-btn:not(.disabled)').forEach(btn => {
                btn.addEventListener('click', () => {
                    const letter = btn.getAttribute('data-letter');
                    const targetGroup = document.getElementById(`letter-${letter}`);
                    if (targetGroup) {
                        targetGroup.scrollIntoView({ behavior: 'smooth', block: 'start' });
                        
                        // 高亮當前字母
                        alphabetNav.querySelectorAll('.alphabet-btn').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                    }
                });
            });

            // 添加國家選擇事件
            const countryItems = countryList.querySelectorAll('.country-item');
            console.log(`綁定 ${countryItems.length} 個國家點擊事件`);
            
            countryItems.forEach((item, index) => {
                item.addEventListener('click', (e) => {
                    console.log('點擊國家:', item.getAttribute('data-country-code'));
                    
                    const countryCode = item.getAttribute('data-country-code');
                    const countryName = item.querySelector('.country-item-name').textContent;
                    
                    console.log('國家代碼:', countryCode, '國家名稱:', countryName);
                    
                    selectedCountryText.textContent = countryName;
                    
                    // 關閉模態框
                    closeCountryModal();
                    
                    if (countryCode) {
                        console.log('開始載入國家電台...');
                        fetchStationsByCountry(countryCode);
                    } else {
                        console.log('載入熱門電台...');
                        fetchPopularStations();
                    }
                });
            });
        }

        // 打開國家選擇模態框
        function openCountryModal() {
            countryModal.classList.remove('hidden');
            countryModal.style.display = 'flex';
            console.log('模態框已打開');
            // 重置字母高亮
            alphabetNav.querySelectorAll('.alphabet-btn').forEach(btn => btn.classList.remove('active'));
        }

        // 關閉國家選擇模態框
        function closeCountryModal() {
            countryModal.classList.add('hidden');
            countryModal.style.display = 'none';
            console.log('模態框已關閉');
        }

        // 按國家獲取電台
        async function fetchStationsByCountry(countryCode) {
            console.log('正在載入國家電台:', countryCode);
            loading.classList.remove('hidden');
            stationsGrid.innerHTML = ''; // 清空現有列表
            
            try {
                const data = await fetchWithRetry(`${API_BASE}/stations/bycountrycodeexact/${countryCode}`);
                console.log(`收到 ${data.length} 個電台`);
                
                // 調試：顯示前3個電台的國家
                if (data.length > 0) {
                    console.log('前3個電台:', data.slice(0, 3).map(s => `${s.name} (${s.country})`));
                }
                
                if (data.length === 0) {
                    stationsGrid.innerHTML = `
                        <div style="grid-column: 1/-1; text-align: center; padding: 60px 20px; color: #00ffff;">
                            <div style="font-size: 3rem; margin-bottom: 20px;">📻</div>
                            <div style="font-size: 1.2rem; margin-bottom: 10px;">此國家目前沒有可用的電台</div>
                            <button onclick="fetchPopularStations(); selectedCountryText.textContent='🌍 選擇國家'" 
                                    style="margin-top: 20px; padding: 12px 24px; background: linear-gradient(135deg, #00ffff, #ff00ff); border: none; border-radius: 20px; color: #000; font-weight: 600; cursor: pointer;">
                                返回熱門電台
                            </button>
                        </div>
                    `;
                    showToast('⚠️ 此國家沒有可用電台');
                } else {
                    console.log('更新全局變量 stations 和 filteredStations');
                    stations = data;
                    filteredStations = data;
                    console.log('開始渲染電台...');
                    renderStations(data);
                    console.log('渲染完成');
                    showToast(`✅ 已載入 ${data.length} 個電台`);
                }
            } catch (error) {
                console.error('獲取國家電台失敗:', error);
                stationsGrid.innerHTML = `
                    <div style="grid-column: 1/-1; text-align: center; padding: 60px 20px; color: #ff00ff;">
                        <div style="font-size: 3rem; margin-bottom: 20px;">😞</div>
                        <div style="font-size: 1.2rem; margin-bottom: 10px;">載入該國電台失敗</div>
                        <div style="font-size: 0.9rem; opacity: 0.7; margin-bottom: 20px;">${error.message}</div>
                        <button onclick="fetchStationsByCountry('${countryCode}')" 
                                style="margin: 10px; padding: 12px 24px; background: linear-gradient(135deg, #00ffff, #ff00ff); border: none; border-radius: 20px; color: #000; font-weight: 600; cursor: pointer;">
                            重試
                        </button>
                        <button onclick="fetchPopularStations(); selectedCountryText.textContent='🌍 選擇國家'" 
                                style="margin: 10px; padding: 12px 24px; background: rgba(255, 255, 255, 0.1); border: 1px solid #00ffff; border-radius: 20px; color: #00ffff; font-weight: 600; cursor: pointer;">
                            返回熱門電台
                        </button>
                    </div>
                `;
                showToast('❌ 載入該國電台失敗');
            }
            loading.classList.add('hidden');
        }

        // 搜尋電台
        async function searchStations(query) {
            if (!query.trim()) {
                filteredStations = stations;
                renderStations(stations);
                return;
            }
            
            loading.classList.remove('hidden');
            try {
                const data = await fetchWithRetry(`${API_BASE}/stations/byname/${encodeURIComponent(query)}`);
                filteredStations = data;
                renderStations(data);
                showToast(`🔍 找到 ${data.length} 個電台`);
            } catch (error) {
                console.error('搜尋失敗:', error);
                showToast('❌ 搜尋失敗');
            }
            loading.classList.add('hidden');
        }

        // 渲染電台列表
        function renderStations(stationList) {
            console.log(`renderStations 收到 ${stationList.length} 個電台`);
            if (stationList.length > 0) {
                console.log('第一個電台:', stationList[0].name, '-', stationList[0].country);
            }
            
            // 先保存電台數據到全局變量
            window.stationsData = {};
            
            stationsGrid.innerHTML = stationList.slice(0, 50).map(station => {
                const isActive = currentStation?.stationuuid === station.stationuuid;
                const isFav = isFavorite(station);
                
                // 保存電台數據
                window.stationsData[station.stationuuid] = station;
                
                return `
                    <div class="station-card ${isActive ? 'active' : ''}" 
                         data-uuid="${station.stationuuid}">
                        <div class="station-logo" ${station.favicon ? `style="background-image: url('${station.favicon}')"` : ''}>
                            ${!station.favicon ? '📻' : ''}
                        </div>
                        <div class="station-name-card">${station.name}</div>
                        <div class="station-details">
                            <div>📍 ${station.country || '未知'}</div>
                            ${station.tags ? `<div style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">🏷️ ${station.tags}</div>` : ''}
                            ${station.bitrate ? `<div>🎵 ${station.bitrate} kbps</div>` : ''}
                        </div>
                        <button class="station-fav-btn ${isFav ? 'active' : ''}" 
                                data-fav-uuid="${station.stationuuid}">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="${isFav ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2">
                                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                            </svg>
                        </button>
                        ${isActive && isPlaying ? `
                            <div class="playing-indicator">
                                <div class="wave-bar"></div>
                                <div class="wave-bar"></div>
                                <div class="wave-bar"></div>
                                <div class="wave-bar"></div>
                            </div>
                        ` : ''}
                    </div>
                `;
            }).join('');
            
            // 使用事件委託
            addStationEventListeners();
        }
        
        // 添加事件監聽器（事件委託）
        let stationClickHandler = null;
        
        function addStationEventListeners() {
            // 移除舊的監聽器（如果存在）
            if (stationClickHandler) {
                stationsGrid.removeEventListener('click', stationClickHandler);
            }
            
            // 創建新的事件處理器
            stationClickHandler = (e) => {
                // 處理收藏按鈕點擊
                const favBtn = e.target.closest('.station-fav-btn');
                if (favBtn) {
                    e.stopPropagation();
                    const uuid = favBtn.getAttribute('data-fav-uuid');
                    const station = window.stationsData[uuid];
                    if (station) {
                        toggleFavorite(station);
                    }
                    return;
                }
                
                // 處理電台卡片點擊
                const card = e.target.closest('.station-card');
                if (card) {
                    const uuid = card.getAttribute('data-uuid');
                    const station = window.stationsData[uuid];
                    if (station) {
                        playStation(station);
                    }
                }
            };
            
            // 添加新的監聽器
            stationsGrid.addEventListener('click', stationClickHandler);
        }

        // 初始化 Audio Context
        function initAudioContext() {
            if (!audioContext && audioPlayer) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioContext = new AudioContext();
                
                source = audioContext.createMediaElementSource(audioPlayer);
                analyser = audioContext.createAnalyser();
                gainNode = audioContext.createGain();
                
                // 均衡器
                const frequencies = [60, 170, 350, 1000, 3500, 10000];
                equalizers = frequencies.map(freq => {
                    const filter = audioContext.createBiquadFilter();
                    filter.type = 'peaking';
                    filter.frequency.value = freq;
                    filter.Q.value = 1;
                    filter.gain.value = audioQuality.checked ? 3 : 0;
                    return filter;
                });
                
                // 連接節點
                source.connect(equalizers[0]);
                for (let i = 0; i < equalizers.length - 1; i++) {
                    equalizers[i].connect(equalizers[i + 1]);
                }
                equalizers[equalizers.length - 1].connect(gainNode);
                gainNode.connect(analyser);
                analyser.connect(audioContext.destination);
                
                analyser.fftSize = 64;
                visualize();
            }
        }

        // 頻譜可視化
        function visualize() {
            if (!analyser) return;
            
            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);
            
            function draw() {
                animationFrame = requestAnimationFrame(draw);
                analyser.getByteFrequencyData(dataArray);
                
                for (let i = 0; i < spectrumBars.length && i < dataArray.length; i++) {
                    const value = dataArray[i] / 255;
                    spectrumBars[i].style.height = `${Math.max(value * 100, 5)}%`;
                    if (isPlaying) {
                        spectrumBars[i].classList.add('active');
                        spectrumBars[i].style.boxShadow = value > 0.5 
                            ? '0 0 10px rgba(0, 255, 255, 0.8)' 
                            : '0 0 10px rgba(0, 255, 255, 0.3)';
                    } else {
                        spectrumBars[i].classList.remove('active');
                    }
                }
            }
            
            draw();
        }

        // 播放電台
        async function playStation(station) {
            try {
                audioPlayer.pause();
                audioPlayer.src = station.url_resolved || station.url;
                
                initAudioContext();
                
                if (audioContext?.state === 'suspended') {
                    await audioContext.resume();
                }
                
                audioPlayer.volume = isMuted ? 0 : volume;
                
                try {
                    await audioPlayer.play();
                    currentStation = station;
                    isPlaying = true;
                    playBtn.disabled = false;
                    updatePlayButton();
                    updateCurrentStation();
                    renderStations(filteredStations);
                    favBtn.style.display = 'flex';
                    updateFavButton();
                    
                    // 通知 Radio Browser（不需要等待回應）
                    fetch(`${API_BASE}/url/${station.stationuuid}`).catch(() => {});
                } catch (playError) {
                    console.error('播放錯誤:', playError);
                    isPlaying = false;
                    updatePlayButton();
                }
            } catch (error) {
                console.error('電台播放失敗:', error);
            }
        }

        // 切換播放
        function togglePlay() {
            if (!currentStation) return;
            
            if (isPlaying) {
                audioPlayer.pause();
                isPlaying = false;
            } else {
                audioPlayer.play().then(() => {
                    isPlaying = true;
                }).catch(error => {
                    console.error('播放失敗:', error);
                });
            }
            updatePlayButton();
            renderStations(filteredStations);
        }

        // 更新播放按鈕
        function updatePlayButton() {
            const playIcon = document.getElementById('playIcon');
            const pauseIcon1 = document.getElementById('pauseIcon1');
            const pauseIcon2 = document.getElementById('pauseIcon2');
            
            if (isPlaying) {
                playIcon.classList.add('hidden');
                pauseIcon1.classList.remove('hidden');
                pauseIcon2.classList.remove('hidden');
                playBtn.classList.add('playing');
            } else {
                playIcon.classList.remove('hidden');
                pauseIcon1.classList.add('hidden');
                pauseIcon2.classList.add('hidden');
                playBtn.classList.remove('playing');
            }
        }

        // 更新當前電台顯示
        function updateCurrentStation() {
            if (currentStation) {
                currentStationName.textContent = currentStation.name;
                currentStationInfo.innerHTML = `
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M5 12.55a11 11 0 0 1 14.08 0"></path>
                        <path d="M1.42 9a16 16 0 0 1 21.16 0"></path>
                        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
                        <line x1="12" y1="20" x2="12.01" y2="20"></line>
                    </svg>
                    <span>${currentStation.country || '未知國家'}</span>
                    <span>·</span>
                    <span>${currentStation.bitrate ? `${currentStation.bitrate} kbps` : '串流中'}</span>
                    ${isPlaying ? `
                        <span>·</span>
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="animation: pulse 2s ease-in-out infinite;">
                            <path d="M5 12.55a11 11 0 0 1 14.08 0"></path>
                            <path d="M1.42 9a16 16 0 0 1 21.16 0"></path>
                            <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
                            <line x1="12" y1="20" x2="12.01" y2="20"></line>
                        </svg>
                        <span>即時播放</span>
                    ` : ''}
                `;
            }
        }

        // 更新收藏按鈕
        function updateFavButton() {
            if (currentStation) {
                const heartPath = document.getElementById('heartPath');
                if (isFavorite(currentStation)) {
                    favBtn.classList.add('active');
                    heartPath.setAttribute('fill', 'currentColor');
                } else {
                    favBtn.classList.remove('active');
                    heartPath.setAttribute('fill', 'none');
                }
            }
        }

        // 切換靜音
        function toggleMute() {
            isMuted = !isMuted;
            audioPlayer.volume = isMuted ? 0 : volume;
            if (gainNode) {
                gainNode.gain.value = isMuted ? 0 : volume;
            }
            updateVolumeIcon();
        }

        // 更新音量圖標
        function updateVolumeIcon() {
            const volumeWaves = document.getElementById('volumeWaves');
            muteBtn.classList.toggle('muted', isMuted);
            
            if (isMuted) {
                volumeWaves.style.display = 'none';
            } else {
                volumeWaves.style.display = 'block';
            }
        }

        // 事件監聽
        playBtn.addEventListener('click', togglePlay);
        favBtn.addEventListener('click', () => {
            if (currentStation) {
                toggleFavorite(currentStation);
            }
        });
        muteBtn.addEventListener('click', toggleMute);
        
        volumeSlider.addEventListener('input', (e) => {
            volume = parseFloat(e.target.value);
            volumeText.textContent = Math.round(volume * 100) + '%';
            audioPlayer.volume = isMuted ? 0 : volume;
            if (gainNode) {
                gainNode.gain.value = isMuted ? 0 : volume;
            }
            volumeSlider.style.background = `linear-gradient(to right, #00ffff ${volume * 100}%, rgba(255, 255, 255, 0.2) ${volume * 100}%)`;
        });

        searchInput.addEventListener('input', (e) => {
            searchStations(e.target.value);
        });

        countrySelectBtn.addEventListener('click', openCountryModal);
        closeModalBtn.addEventListener('click', closeCountryModal);
        
        // 點擊模態框外部關閉
        countryModal.addEventListener('click', (e) => {
            if (e.target === countryModal) {
                closeCountryModal();
            }
        });

        audioQuality.addEventListener('change', (e) => {
            const gain = e.target.checked ? 3 : 0;
            equalizers.forEach(filter => {
                filter.gain.value = gain;
            });
            document.getElementById('qualityLabel').style.color = e.target.checked ? '#00ffff' : '#fff';
        });

        // 初始化
        loadFavorites();
        fetchPopularStations();
        fetchCountries();
        volumeSlider.style.background = `linear-gradient(to right, #00ffff ${volume * 100}%, rgba(255, 255, 255, 0.2) ${volume * 100}%)`;
    </script>
</body>
</html>
